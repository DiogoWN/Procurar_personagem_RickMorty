<body>
    <form action="" method="get">
        <h2>Buscar personagem pelo ID</h2>
         ID do personagem: <input type="number" name="characterId" id="characterId">

        <h2>Informações</h2>
        Nome:<input type="checkbox" name="name" id="name">

        <button id="btn-go">Procurar</button>
    </form>
